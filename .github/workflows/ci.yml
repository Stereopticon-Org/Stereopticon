name: CI

# Runs the test suite on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the catalogue bundle
        run: npm run bundle
      - run: npm run dist
      - name: upload a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stereopticon-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
