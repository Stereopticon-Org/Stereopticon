name: Release

# Push a version tag (e.g. v0.1.0) to build the Windows installer and the
# portable zip and attach them to a draft GitHub release for that tag.
# The tag must match "version" in package.json. Review the draft, write
# the release notes, then publish it from the Releases page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      # A tag builds and uploads to a draft release. Running the workflow by
      # hand (Actions → Release → Run workflow) only builds, as a test: the
      # files are kept as a workflow artifact and no release is touched.
      - name: Build (and upload to a draft release for a tag)
        shell: bash
        run: npm run dist -- --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Two downloads on the run page, like the two files on a release.
      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Stereopticon-Setup
          path: dist/*Setup*.exe
          if-no-files-found: error
      - name: Keep the portable zip as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Stereopticon-portable
          path: dist/*-portable.zip
          if-no-files-found: error
