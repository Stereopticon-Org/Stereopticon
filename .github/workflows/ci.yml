name: CI

# Runs the tests on every pull request. Pushes to main are tested and built by
# the Nightly workflow (nightly.yml), which grew out of PR #4.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the catalogue bundle
        run: npm run bundle
