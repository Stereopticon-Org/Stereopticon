name: Nightly

# Every push to main is tested, built and published as a nightly pre-release
# (v<version>-nightly.<run>), so testers can download it without signing in.
# Settings → About → "Get Stereopticon beta updates" offers these builds.
# Proper releases are still made by pushing a version tag (release.yml).
# Started from Lobanokivan11's PR #4.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the catalogue bundle
        run: npm run bundle

      # Name the build, so the app and the files say which nightly it is.
      - name: Set the nightly version
        id: version
        shell: bash
        run: |
          # The next patch version: nightlies after 0.1.0 are 0.1.1-nightly.<UTC
          # time>, newer than the release and older than 0.1.1. The fixed-width
          # time (202611251230) keeps GitHub's Releases page, which sorts tags
          # as text, in date order; a run number put nightly.8 above nightly.11.
          base=$(node -p "const [a,b,c]=require('./package.json').version.split('-')[0].split('.').map(Number); [a,b,c+1].join('.')")
          version="$base-nightly.$(date -u +%Y%m%d%H%M)"
          npm version --no-git-tag-version --allow-same-version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Stereopticon's own SteamGridDB key, if the SGDB_API_KEY secret is set,
      # so artwork works without each user getting a key.
      - name: Add build-time keys
        shell: bash
        env:
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
        run: |
          node -e "require('fs').writeFileSync('modules/builtin-keys.json', JSON.stringify({ steamGridDb: process.env.SGDB_API_KEY || '' }))"

      - name: Build the installer and portable zip
        run: npm run dist -- --publish never

      # Each nightly is its own pre-release (v0.1.1-nightly.<UTC time>) so the
      # app can compare versions; only the newest three (by date) are kept.
      - name: Publish the nightly pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          sha=$(git rev-parse --short HEAD)
          gh release create "v$v" --prerelease --target "$GITHUB_SHA" \
            --title "Stereopticon $v (nightly #${{ github.run_number }})" \
            --notes "Automatic build of main at $sha: $(git log -1 --format=%s). For testing, not a release." \
            dist/*Setup*.exe dist/*-portable.zip
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | contains("-nightly.")))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes; done

      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Stereopticon-Setup-${{ steps.version.outputs.version }}
          path: dist/*Setup*.exe
          retention-days: 14
      - name: Keep the portable zip as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Stereopticon-portable-${{ steps.version.outputs.version }}
          path: dist/*-portable.zip
          retention-days: 14
